name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许手动触发部署
  workflow_dispatch:

# 授予 GITHUB_TOKEN 写入权限，否则无法推送到 gh-pages 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static files
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          # cname: dzstudio.com
          # 保留提交历史，便于追溯
          force_orphan: false
